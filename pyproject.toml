[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-rag-agent"
version = "0.1.0"
description = "A highly modular, autonomous, multi-step RAG engine designed for municipal open data."
authors = [
    { name = "PCSTAR", email = "developer@example.com" }
]
dependencies = [
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "google-genai>=0.5.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "faiss-cpu>=1.7.4",
    "pinecone>=5.0.0",

    "google-api-python-client>=2.100.0",
    "pdfplumber>=0.11.0",
    "pandas>=2.0.0",
    "mcp>=1.2.0",
]
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.14.5",
]

[tool.ruff]
line-length = 88
exclude = [
    ".venv",
    "backend/vault",
]

[tool.setuptools.packages.find]
where = ["."]
